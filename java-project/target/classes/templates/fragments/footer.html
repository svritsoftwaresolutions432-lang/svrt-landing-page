<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" id="contact" class="site-footer">
    <div class="container">
        <div class="footer-grid">
            <div>
                <div class="logo">
                    <div class="logo-box transparent"><span th:text="${site.logoPrimary}">SVR</span></div>
                    <span class="logo-text" th:text="${site.logoSecondary}">IT Software Solutions</span>
                </div>
                <p class="footer-address" th:text="${site.address}">Address</p>
            </div>
            <div>
                <h4 class="footer-heading">Navigation</h4>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About Us</a></li>
                </ul>
            </div>
            <div>
                <h4 class="footer-heading">Quick Link</h4>
                <ul>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#contact">Contact Us</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-contact">
            <div class="contact-item">
                <div class="contact-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                <span th:text="${site.location}">Location</span>
            </div>
            <div class="contact-item">
                <div class="contact-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
                </div>
                <span th:text="${site.phone}">Phone</span>
            </div>
            <div class="contact-item">
                <div class="contact-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <span th:text="${site.email}">Email</span>
            </div>
        </div>

        <div class="copyright">
            &copy; <span th:text="${year}">2026</span> SVR IT Software Solutions &bull; All Rights Reserved
        </div>
    </div>
</footer>
</body>
</html>
